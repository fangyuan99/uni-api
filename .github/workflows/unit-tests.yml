name: Rust Unit Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.84.0"
          components: rustfmt, clippy
      - name: Check Rust
        run: |
          cargo fmt --check --manifest-path rust/uni-api-native/Cargo.toml
          cargo clippy --manifest-path rust/uni-api-native/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/uni-api-native/Cargo.toml --locked
